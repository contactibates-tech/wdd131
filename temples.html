<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | WDD 131 – Isaac Bates</title>
  <meta name="description" content="A responsive temple picture album built for WDD 131 – Dynamic Web Fundamentals by Isaac Bates, featuring temples from around the world.">
  <meta name="author" content="Isaac Bates">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="scripts/temples.js" defer></script>
</head>
<body>

  <header>
    <span class="site-title">Temple Album</span>
    <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav"></button>
    <nav id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#old">Old</a></li>
        <li><a href="#new">New</a></li>
        <li><a href="#large">Large</a></li>
        <li><a href="#small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Temples of the World</h1>

    <div class="album">
      <figure>
        <img src="images/temple-placeholder.jpg" alt="Salt Lake Temple" width="600" height="400" loading="lazy">
        <figcaption>Salt Lake Temple</figcaption>
      </figure>

      <figure id="old">
        <img src="images/temple-placeholder.jpg" alt="St. George Utah Temple" width="600" height="400" loading="lazy">
        <figcaption>St. George Utah Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple-placeholder.jpg" alt="Logan Utah Temple" width="600" height="400" loading="lazy">
        <figcaption>Logan Utah Temple</figcaption>
      </figure>

      <figure id="new">
        <img src="images/temple-placeholder.jpg" alt="Rome Italy Temple" width="600" height="400" loading="lazy">
        <figcaption>Rome Italy Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple-placeholder.jpg" alt="Paris France Temple" width="600" height="400" loading="lazy">
        <figcaption>Paris France Temple</figcaption>
      </figure>

      <figure id="large">
        <img src="images/temple-placeholder.jpg" alt="Los Angeles California Temple" width="600" height="400" loading="lazy">
        <figcaption>Los Angeles California Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple-placeholder.jpg" alt="Washington D.C. Temple" width="600" height="400" loading="lazy">
        <figcaption>Washington D.C. Temple</figcaption>
      </figure>

      <figure id="small">
        <img src="images/temple-placeholder.jpg" alt="Colonia Juárez Chihuahua Mexico Temple" width="600" height="400" loading="lazy">

      <figure>
        <img src="images/temple-placeholder.jpg" alt="Laie Hawaii Temple" width="600" height="400" loading="lazy">
        <figcaption>Laie Hawaii Temple</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> &nbsp;Isaac Bates &nbsp;⛰&nbsp; North Logan, Utah</p>
    <p id="lastModified"></p>
  </footer>

</html>
