<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131 – Isaac Bates</title>
  <meta name="description" content="Share your experience with a product by submitting a review. Built for WDD 131 – Dynamic Web Fundamentals by Isaac Bates.">
  <meta name="author" content="Isaac Bates">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/products.js" defer></script>
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <header>
    <span class="site-title">Product Reviews</span>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="place.html">Place</a></li>
        <li><a href="filtered-temples.html">Temples</a></li>
        <li><a href="form.html" aria-current="page">Review</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Write a Review</h1>
    <p class="lead">Tell us how your product is holding up. Fields marked with <span class="req" aria-hidden="true">*</span><span class="visually-hidden">an asterisk</span> are required.</p>

    <form action="review.html" method="get">

      <div class="field">
        <label for="productName">Product Name <span class="req" aria-hidden="true">*</span></label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field rating">
        <legend>Overall Rating <span class="req" aria-hidden="true">*</span></legend>
        <div class="stars">
          <span class="star">
            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1"><span class="visually-hidden">1 star</span><span aria-hidden="true">&starf;</span></label>
          </span>
          <span class="star">
            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2"><span class="visually-hidden">2 stars</span><span aria-hidden="true">&starf;</span></label>
          </span>
          <span class="star">
            <input type="radio" id="rating3" name="rating" value="3" required>
            <label for="rating3"><span class="visually-hidden">3 stars</span><span aria-hidden="true">&starf;</span></label>
          </span>
          <span class="star">
            <input type="radio" id="rating4" name="rating" value="4" required>
            <label for="rating4"><span class="visually-hidden">4 stars</span><span aria-hidden="true">&starf;</span></label>
          </span>
          <span class="star">
            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5"><span class="visually-hidden">5 stars</span><span aria-hidden="true">&starf;</span></label>
          </span>
        </div>
      </fieldset>

      <div class="field">
        <label for="installdate">Date of Installation <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="installdate" name="installdate" required>
      </div>

      <fieldset class="field">
        <legend>Useful Features</legend>
        <div class="checks">
          <div class="check">
            <input type="checkbox" id="feature-durability" name="features" value="Durability">
            <label for="feature-durability">Durability</label>
          </div>
          <div class="check">
            <input type="checkbox" id="feature-install" name="features" value="Ease of installation">
            <label for="feature-install">Ease of installation</label>
          </div>
          <div class="check">
            <input type="checkbox" id="feature-performance" name="features" value="Performance">
            <label for="feature-performance">Performance</label>
          </div>
          <div class="check">
            <input type="checkbox" id="feature-design" name="features" value="Design">
            <label for="feature-design">Design</label>
          </div>
          <div class="check">
            <input type="checkbox" id="feature-value" name="features" value="Value for price">
            <label for="feature-value">Value for price</label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5" placeholder="What did you like or dislike?"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username" autocomplete="name" placeholder="Optional">
      </div>

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> &nbsp;Isaac Bates &nbsp;⛰&nbsp; North Logan, Utah</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
