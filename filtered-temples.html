<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtered Temple Album | WDD 131 – Isaac Bates</title>
  <meta name="description" content="A responsive, filterable temple picture album built for WDD 131 – Dynamic Web Fundamentals by Isaac Bates, generated dynamically with JavaScript.">
  <meta name="author" content="Isaac Bates">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>

  <header>
    <span class="site-title">Temple Album</span>
    <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav"></button>
    <nav id="primary-nav">
      <ul>
        <li><a href="#" data-filter="home" class="active">Home</a></li>
        <li><a href="#" data-filter="old">Old</a></li>
        <li><a href="#" data-filter="new">New</a></li>
        <li><a href="#" data-filter="large">Large</a></li>
        <li><a href="#" data-filter="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Temples of the World</h1>
    <p id="result-count" class="result-count"></p>

    <div class="album" id="album">
      <!-- Temple cards are generated dynamically by scripts/filtered-temples.js -->
    </div>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> &nbsp;Isaac Bates &nbsp;⛰&nbsp; North Logan, Utah</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
