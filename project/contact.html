<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send a note about a part standard or quality problem.">
  <title>JM Part Standards Hub | Feedback</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="feedback">
  <header>
    <a class="brand" href="index.html"><img src="images/logo.svg" alt="" width="56" height="56"><span>JM Part Standards Hub</span></a>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#parts">Parts</a></li>
        <li><a href="contact.html" aria-current="page">Feedback</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Send feedback</h1>
    <p>Found an unclear step or a quality problem? Tell us which part it affects.</p>
    <form id="feedback-form" method="post" action="contact.html">
      <div>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div>
        <label for="part">Part</label>
        <select id="part" name="part" required>
          <option value="">Choose a part</option>
        </select>
      </div>
      <fieldset>
        <legend>Priority</legend>
        <label><input type="radio" name="priority" value="low" checked> Low</label>
        <label><input type="radio" name="priority" value="medium"> Medium</label>
        <label><input type="radio" name="priority" value="high"> High</label>
      </fieldset>
      <div>
        <label for="notes">Your note</label>
        <textarea id="notes" name="notes" rows="5" minlength="10" required></textarea>
      </div>
      <button type="submit">Send feedback</button>
      <p id="form-message" role="status"></p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 JM Part Standards Hub | <a href="references.html">References</a></p>
  </footer>
  <script src="scripts/parts.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
