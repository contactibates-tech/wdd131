<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bahamas | WDD 131 – Isaac Bates</title>
  <meta name="description" content="A page about the Bahamas, a place I've visited, built for WDD 131 – Dynamic Web Fundamentals by Isaac Bates.">
  <meta name="author" content="Isaac Bates">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>

  <header>
    <h1 class="page-title">The Bahamas</h1>
  </header>

  <main>

    <section class="hero">
      <picture>
        <source media="(min-width: 640px)" srcset="images/hero-bahamas-wide.webp">
        <img src="images/hero-bahamas-mobile.webp" srcset="images/hero-bahamas-mobile.webp 900w, images/hero-bahamas-wide.webp 1600w" sizes="100vw" alt="Turquoise water, white sand, and leaning palm trees on a Bahamian beach" width="1600" height="700">
      </picture>

      <div class="info-boxes">
        <aside class="info-box data-box" id="data">
          <h2>Data</h2>
          <dl>
            <div><dt>Capital</dt><dd>Nassau</dd></div>
            <div><dt>Population</dt><dd>~410,000</dd></div>
            <div><dt>Language</dt><dd>English</dd></div>
            <div><dt>Currency</dt><dd>Bahamian Dollar</dd></div>
            <div><dt>Islands</dt><dd>700+ cays</dd></div>
            <div><dt>Land Area</dt><dd>5,382 sq mi</dd></div>
          </dl>
        </aside>

        <aside class="info-box weather-box" id="weather">
          <h2>Weather</h2>
          <img class="weather-icon-mobile" src="images/weather-icon.svg" alt="Partly cloudy weather icon" width="48" height="48">
          <dl>
            <div><dt>Condition</dt><dd>Partly Cloudy</dd></div>
            <div><dt>Temperature</dt><dd id="temperature">84&deg;F</dd></div>
            <div><dt>Wind Speed</dt><dd id="windspeed">12 mph</dd></div>
            <div><dt>Wind Chill</dt><dd id="windchill"></dd></div>
          </dl>
        </aside>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Isaac Bates --- North Logan, Utah</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
